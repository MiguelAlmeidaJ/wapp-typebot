<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Whatsapp</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.png">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      /* Garantindo que a página ocupe 100% da altura e largura */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Impede a rolagem geral */
      }

      /* Ajustando o #root para ocupar a tela inteira */
      #root {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: auto; /* Permite rolagem apenas se necessário */
      }

      /* Aplique o zoom com a transformação apenas em telas grandes */
      @media (min-width: 960px) {
        body {
          transform: scale(0.90); /* Aplica o zoom de 75% */
          transform-origin: 0 0; /* Aplica o zoom a partir do canto superior esquerdo */
          width: 111.1%; /* Ajusta a largura para compensar o zoom */
          height: 111.1%; /* Ajusta a altura para compensar o zoom */
        }
      }

      /* Impedindo rolagem ao focar em campos de input */
      input:focus, textarea:focus, select:focus {
        outline: none;
        z-index: 10; /* Garante que o foco não cause deslocamento */
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
