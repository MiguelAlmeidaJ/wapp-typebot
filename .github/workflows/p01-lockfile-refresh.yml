name: P0.1 Lockfile Refresh

on:
  push:
    branches:
      - develop
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/p01-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Publish detached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE' > /tmp/blob.json
          const fs = require('node:fs');
          const content = fs.readFileSync('pnpm-lock.yaml').toString('base64');
          process.stdout.write(JSON.stringify({ content, encoding: 'base64' }));
          NODE
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).sha+'\n'))" \
            > p01-blob-sha.txt

      - name: Upload lockfile and blob SHA
        uses: actions/upload-artifact@v4
        with:
          name: p01-pnpm-lock
          path: |
            pnpm-lock.yaml
            p01-blob-sha.txt
          if-no-files-found: error
